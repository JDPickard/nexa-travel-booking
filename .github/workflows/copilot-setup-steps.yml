name: Copilot setup steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .gitmodules
      - setup_symlinks.py
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .gitmodules
      - setup_symlinks.py

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize shared AI rules submodule
        env:
          DEMO_AI_RULES_READ_TOKEN: ${{ secrets.DEMO_AI_RULES_READ_TOKEN }}
        run: |
          if [ -z "$DEMO_AI_RULES_READ_TOKEN" ]; then
            echo "::error::DEMO_AI_RULES_READ_TOKEN is not available to this workflow run."
            exit 1
          fi
          AUTH_HEADER="$(printf 'x-access-token:%s' "$DEMO_AI_RULES_READ_TOKEN" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" submodule update --init --recursive

      - name: Create shared AI links and enable Git hooks
        run: python3 setup_symlinks.py
